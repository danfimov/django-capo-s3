[project]
name = "django-capo-s3"
description = "Support for S3 storage backend in Django"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "capo-s3==0.13.0",
    "cryptography>=50.0.0",
    "typing-extensions>=4.4",  # for @override with Python 3.11
]

[project.urls]
Documentation = "https://github.com/danfimov/django-capo-s3"
Repository = "https://github.com/danfimov/django-capo-s3"
Changelog = "https://github.com/danfimov/django-capo-s3/releases"

[dependency-groups]
dev = [
    "prek>=0.4.14",
    {include-group = "lint"},
    {include-group = "types"},
    {include-group = "test"},
    {include-group = "docs"},
]
docs = [
    "zensical>=0.0.56",
]
lint = [
    "ruff>=0.16.3",
    "zizmor>=1.29.0",
]
test = [
    "dirty-equals>=0.11",
    "pytest>=9.1.1",
    "pytest-codspeed>=5.0.3",
    "pytest-django>=4.14.0",
    "pytest-memray>=1.10.0",
    "pytest-timeout>=2.4.0",
    "zapros[pyreqwest]>=0.16.0",
]
types = [
    "mypy>=2.3.1",
    "django-stubs[compatible-mypy]>=6.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/django_capo_s3/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_capo_s3"]

[tool.hatch.build.targets.sdist]
include = [
  "src/django_capo_s3",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY",
    "D203",  # conflicting with D211
    "D213",  # conflicting with D212
    "D413",
    "D100",
    "D104",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "ANN",
    "PLR2004",
    "S101",
    "INP001",  # test directories are not import packages
]
"example_app/**" = [
    "D",
    "INP001",  # example project, not an import package
    "T201",  # print() is fine in the demo scripts
    "S106",  # the local MinIO credentials are not a secret
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase".msg = "Use pytest-style tests."
"django.test.TestCase".msg = "Use pytest-style tests."
"__future__.annotations".msg = "Use normal type annotation. Use string type annotations only in a targeted manner."

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
disallow_any_generics = false
warn_unreachable = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "mutable-override",
    "redundant-self",
    "deprecated",
]

[tool.django-stubs]
django_settings_module = "tests.settings"
